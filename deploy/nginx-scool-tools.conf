# Nach /etc/nginx/sites-available/scool-tools kopieren, Domain und Zertifikatspfade ersetzen.
# Danach verlinken, mit `nginx -t` prüfen und Nginx neu laden.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=scool_api:10m  rate=15r/s;
limit_req_zone  $binary_remote_addr zone=scool_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=scool_per_ip:10m;
limit_conn_zone $server_name        zone=scool_total:10m;

upstream scool_tools_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tools.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tools.example.de;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/tools.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 5m;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=scool_auth burst=60 nodelay;
        limit_conn scool_per_ip 60;
        limit_conn scool_total 600;
        proxy_pass http://scool_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/workspaces/[^/]+/live$ {
        limit_req zone=scool_api burst=120 nodelay;
        limit_conn scool_per_ip 60;
        limit_conn scool_total 600;
        proxy_pass http://scool_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=scool_api burst=120 nodelay;
        limit_conn scool_per_ip 60;
        limit_conn scool_total 600;
        proxy_pass http://scool_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://scool_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
